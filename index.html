<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Movimientos Taller y Servicios RAC</title>
    
    <!-- Tailwind CSS desde CDN para estilos modernos y limpios -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK (v9/v10 Compatibility Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- html2pdf.js para exportar reportes a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
        }

        /* Estilos específicos para la generación e impresión del Informe PDF */
        #informeArea {
            background-color: #ffffff;
            color: #111827;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .informe-titulo {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #111827;
            letter-spacing: 0.5px;
        }

        .informe-subtitulo {
            font-size: 14px;
            color: #374151;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .informe-seccion-titulo {
            font-size: 16px;
            font-weight: bold;
            color: #111827;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        .informe-item {
            font-size: 14px;
            color: #1f2937;
            margin-left: 12px;
            margin-bottom: 4px;
            font-family: monospace;
        }

        .informe-vacio {
            font-size: 13px;
            color: #9ca3af;
            margin-left: 12px;
            font-style: italic;
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">

        <!-- HEADER & STATUS -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Control de Movimientos Taller RAC</h1>
                <p class="text-sm text-gray-500">Gestión de Estados, Recepción y Entregas de Vehículos</p>
            </div>
            <div id="firebaseStatus" class="flex items-center gap-2 px-4 py-2 rounded-full bg-yellow-100 text-yellow-800 font-medium text-sm">
                <span class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></span>
                <span>Conectando con Firebase...</span>
            </div>
        </div>

        <!-- FORMULARIO DE REGISTRO DE MOVIMIENTO -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Registrar Nuevo Movimiento</h2>
            
            <form id="formMovimiento" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Patente</label>
                    <input type="text" id="inputPatente" placeholder="Ej: SWVR65" required uppercase
                           class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 uppercase font-mono text-gray-800">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Movimiento</label>
                    <select id="selectTipo" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">-- Seleccionar Estado --</option>
                        <option value="Ingresos a Taller">Ingresos a Taller</option>
                        <option value="Pendientes de Retiro">Pendientes de Retiro</option>
                        <option value="Retiros de Taller">Retiros de Taller</option>
                        <option value="Rechazos / Reingresos">Rechazos / Reingresos</option>
                        <option value="Entregadas a Logistica">Entregadas a Logística</option>
                        <option value="Devolucion Definitiva">Devolución Definitiva</option>
                        <option value="Devolucion Definitiva Pendiente de Ingreso">Devolución Definitiva Pendiente de Ingreso</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                    <input type="date" id="inputFecha" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="md:col-span-3 flex justify-end mt-2">
                    <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow transition flex items-center gap-2">
                        <span>Registrar Patente</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- LISTADO Y FILTROS -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4 border-b pb-4">
                <h2 class="text-lg font-bold text-gray-800">Registros del Día</h2>
                <div class="flex items-center gap-3">
                    <input type="date" id="filtroFecha" class="px-3 py-1.5 border rounded-lg text-sm">
                    <button id="btnGenerarPDF" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-2">
                        <span>Exportar Informe PDF</span>
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs">
                            <th class="py-3 px-4">Patente</th>
                            <th class="py-3 px-4">Tipo de Movimiento</th>
                            <th class="py-3 px-4">Fecha</th>
                            <th class="py-3 px-4">Hora</th>
                            <th class="py-3 px-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo" class="divide-y divide-gray-200 text-sm">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- AREA OCULTA PARA IMPRESIÓN/GENERACIÓN DE INFORME PDF -->
    <div style="display: none;">
        <div id="informeArea">
            <div class="informe-titulo">INFORME DE MOVIMIENTOS RAC</div>
            <div class="informe-subtitulo" id="pdfEncabezadoInfo">Periodo: DIA | Fecha de emisión: 2026-08-23</div>
            
            <div id="pdfContenidoCategorias">
                <!-- Se construye dinámicamente incluyendo las 7 categorías -->
            </div>
        </div>
    </div>

    <script>
        // Configuración de Firebase Firestore
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForTemplate-Only",
            authDomain: "movimientos-taller-c4547.firebaseapp.com",
            projectId: "movimientos-taller-c4547",
            storageBucket: "movimientos-taller-c4547.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        // Inicialización de Firebase
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            
            // Probar conexión
            db.collection('movimientos').limit(1).get().then(() => {
                const statusEl = document.getElementById('firebaseStatus');
                statusEl.className = "flex items-center gap-2 px-4 py-2 rounded-full bg-green-100 text-green-800 font-medium text-sm";
                statusEl.innerHTML = `<span class="w-3 h-3 rounded-full bg-green-500"></span><span>🟢 Firebase conectado</span>`;
            }).catch(err => {
                console.error("Error al conectar Firebase:", err);
            });
        } catch (e) {
            console.error("Error inicializando Firebase:", e);
        }

        // Definición de Categorías Estándar del Informe (7 Categorías)
        const CATEGORIAS_INFORME = [
            "Ingresos a Taller",
            "Pendientes de Retiro",
            "Retiros de Taller",
            "Rechazos / Reingresos",
            "Entregadas a Logistica",
            "Devolucion Definitiva",
            "Devolucion Definitiva Pendiente de Ingreso"
        ];

        // Elementos del DOM
        const formMovimiento = document.getElementById('formMovimiento');
        const inputPatente = document.getElementById('inputPatente');
        const selectTipo = document.getElementById('selectTipo');
        const inputFecha = document.getElementById('inputFecha');
        const filtroFecha = document.getElementById('filtroFecha');
        const tablaCuerpo = document.getElementById('tablaCuerpo');
        const btnGenerarPDF = document.getElementById('btnGenerarPDF');

        // Establecer fecha actual por defecto
        const hoyStr = new Date().toISOString().split('T')[0];
        inputFecha.value = hoyStr;
        filtroFecha.value = hoyStr;

        // Escuchar cambios en la fecha del filtro
        filtroFecha.addEventListener('change', cargarMovimientos);

        // Guardar nuevo movimiento
        formMovimiento.addEventListener('submit', async (e) => {
            e.preventDefault();
            const patente = inputPatente.value.trim().toUpperCase();
            const tipo = selectTipo.value;
            const fecha = inputFecha.value;
            const ahora = new Date();
            
            // Formatear hora (ej: 04:29 p. m.)
            const horaFormatted = ahora.toLocaleTimeString('es-CL', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });

            if (!patente || !tipo || !fecha) return;

            try {
                await db.collection('movimientos').add({
                    patente: patente,
                    tipo: tipo,
                    fecha: fecha,
                    hora: horaFormatted,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                inputPatente.value = '';
                cargarMovimientos();
            } catch (error) {
                alert("Error al guardar la patente: " + error.message);
            }
        });

        // Cargar registros desde Firestore
        function cargarMovimientos() {
            const fechaSeleccionada = filtroFecha.value;
            tablaCuerpo.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-500">Cargando datos...</td></tr>`;

            db.collection('movimientos')
                .where("fecha", "==", fechaSeleccionada)
                .get()
                .then((snapshot) => {
                    let html = '';
                    let movimientosList = [];

                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        movimientosList.push({ id: doc.id, ...data });
                    });

                    // Ordenar por hora/timestamp
                    movimientosList.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                    if (movimientosList.length === 0) {
                        tablaCuerpo.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">No hay movimientos registrados para esta fecha.</td></tr>`;
                        return;
                    }

                    movimientosList.forEach((m) => {
                        html += `
                            <tr class="hover:bg-gray-50">
                                <td class="py-3 px-4 font-mono font-bold text-gray-800">${m.patente}</td>
                                <td class="py-3 px-4">${m.tipo}</td>
                                <td class="py-3 px-4">${m.fecha}</td>
                                <td class="py-3 px-4">${m.hora}</td>
                                <td class="py-3 px-4 text-center">
                                    <button onclick="eliminarMovimiento('${m.id}')" class="text-red-500 hover:text-red-700 font-medium text-xs">Eliminar</button>
                                </td>
                            </tr>
                        `;
                    });

                    tablaCuerpo.innerHTML = html;
                })
                .catch((error) => {
                    console.error("Error al cargar registros:", error);
                    tablaCuerpo.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500">Error al cargar registros. Revisa las reglas o índices en Firebase.</td></tr>`;
                });
        }

        // Eliminar registro
        async function eliminarMovimiento(id) {
            if (confirm("¿Estás seguro de eliminar este registro?")) {
                try {
                    await db.collection('movimientos').doc(id).delete();
                    cargarMovimientos();
                } catch (err) {
                    alert("Error al eliminar: " + err.message);
                }
            }
        }

        // Generar Reporte PDF con html2pdf.js
        btnGenerarPDF.addEventListener('click', async () => {
            const fechaSeleccionada = filtroFecha.value;

            try {
                const snapshot = await db.collection('movimientos')
                    .where("fecha", "==", fechaSeleccionada)
                    .get();

                const registros = [];
                snapshot.forEach(doc => registros.push(doc.data()));

                // Agrupar registros por categoría
                const agrupados = {};
                CATEGORIAS_INFORME.forEach(cat => agrupados[cat] = []);

                registros.forEach(item => {
                    const tipoNormalizado = item.tipo ? item.tipo.trim() : '';
                    if (agrupados[tipoNormalizado]) {
                        agrupados[tipoNormalizado].push(item);
                    } else {
                        // Mapeo flexible para variaciones
                        if (tipoNormalizado.includes('Pendiente')) {
                            agrupados['Devolucion Definitiva Pendiente de Ingreso'].push(item);
                        } else if (tipoNormalizado.includes('Devolucion Definitiva') || tipoNormalizado.includes('Devolución Definitiva')) {
                            agrupados['Devolucion Definitiva'].push(item);
                        } else if (tipoNormalizado.includes('Entregadas')) {
                            agrupados['Entregadas a Logistica'].push(item);
                        } else if (tipoNormalizado.includes('Rechazos')) {
                            agrupados['Rechazos / Reingresos'].push(item);
                        } else if (tipoNormalizado.includes('Retiros')) {
                            agrupados['Retiros de Taller'].push(item);
                        } else if (tipoNormalizado.includes('Pendientes')) {
                            agrupados['Pendientes de Retiro'].push(item);
                        } else if (tipoNormalizado.includes('Ingresos')) {
                            agrupados['Ingresos a Taller'].push(item);
                        }
                    }
                });

                // Construir HTML del PDF
                document.getElementById('pdfEncabezadoInfo').innerText = `Periodo: DIA | Fecha de emisión: ${fechaSeleccionada}`;
                
                let htmlPDF = '';
                CATEGORIAS_INFORME.forEach(cat => {
                    const lista = agrupados[cat] || [];
                    htmlPDF += `<div class="informe-seccion-titulo">${cat} (${lista.length})</div>`;
                    
                    if (lista.length === 0) {
                        htmlPDF += `<div class="informe-vacio">Sin movimientos</div>`;
                    } else {
                        lista.forEach(m => {
                            htmlPDF += `<div class="informe-item">- ${m.patente} | ${m.hora}</div>`;
                        });
                    }
                });

                document.getElementById('pdfContenidoCategorias').innerHTML = htmlPDF;

                // Generar PDF
                const elementoInforme = document.getElementById('informeArea');
                const opt = {
                    margin:       [10, 15, 10, 15],
                    filename:     `Informe_Movimientos_RAC_${fechaSeleccionada}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(elementoInforme).save();

            } catch (error) {
                alert("Error generando el informe: " + error.message);
            }
        });

        // Carga inicial
        cargarMovimientos();
    </script>
</body>
</html>
